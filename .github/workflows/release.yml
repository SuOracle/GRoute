name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 27.3.13750724

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dhttp.proxyHost= -Dhttps.proxyHost="

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and platform tools
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Verify strongSwan generated sources
        run: |
          missing=0
          for f in \
            strongswan/src/libstrongswan/asn1/oid.c \
            strongswan/src/libstrongswan/asn1/oid.h \
            strongswan/src/libstrongswan/crypto/proposal/proposal_keywords_static.c \
            strongswan/src/libstrongswan/crypto/proposal/proposal_keywords_static.h \
            strongswan/src/libstrongswan/settings/settings_parser.c \
            strongswan/src/libstrongswan/settings/settings_parser.h \
            strongswan/src/libstrongswan/settings/settings_lexer.c \
            strongswan/Android.common.mk \
            strongswan/src/frontends/android/app/src/main/jni/openssl/Android.mk
          do
            if [ ! -f "$f" ]; then
              echo "::error::missing generated source: $f"
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "::error::Generate these locally and commit with 'git add -f'."
            exit 1
          fi
          echo "All strongSwan generated sources present."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify prebuilt Xray core
        run: |
          if [ ! -f app/libs/gozarcore.aar ]; then
            echo "::error::app/libs/gozarcore.aar is missing. Build it with gomobile and commit it."
            exit 1
          fi
          ls -lh app/libs/gozarcore.aar

      - name: Strip any proxy settings from gradle.properties
        run: |
          for f in gradle.properties gradle/gradle.properties gradle/gradle-daemon-jvm.properties; do
            if [ -f "$f" ]; then
              sed -i '/proxyHost/d; /proxyPort/d' "$f"
            fi
          done

      - name: Remove any committed local signing config
        run: rm -f keystore.properties

      - name: Read version from build.gradle.kts
        id: version
        run: |
          NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building versionName=$NAME versionCode=$CODE"

      - name: Check tag matches versionName
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "${{ steps.version.outputs.name }}" ]; then
            echo "::error::Tag v$TAG does not match versionName ${{ steps.version.outputs.name }} in app/build.gradle.kts"
            exit 1
          fi

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build signed release
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APKs and generate checksums
        run: |
          V="${{ steps.version.outputs.name }}"
          OUT=dist
          mkdir -p "$OUT"
          for apk in app/build/outputs/apk/release/*.apk; do
            [ -e "$apk" ] || continue
            base=$(basename "$apk")
            abi=$(echo "$base" | grep -oE 'arm64-v8a|armeabi-v7a|x86_64|x86' || echo universal)
            cp "$apk" "$OUT/GRoute-v${V}-${abi}.apk"
          done
          cd "$OUT"
          sha256sum *.apk > SHA256SUMS.txt
          ls -lh
          cat SHA256SUMS.txt

      - name: Verify APK signatures
        run: |
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          for apk in dist/*.apk; do
            "$BT/apksigner" verify --print-certs "$apk" | head -4
          done

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GRoute-release-v${{ steps.version.outputs.name }}
          path: dist/*
          if-no-files-found: error

      - name: Upload mapping file
        uses: actions/upload-artifact@v4
        with:
          name: mapping-v${{ steps.version.outputs.name }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn

      - name: Create draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: GRoute v${{ steps.version.outputs.name }}
          draft: true
          prerelease: false
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up secrets from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
